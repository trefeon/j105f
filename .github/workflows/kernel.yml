name: Linux boot.img (j1minilte)

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'linux/**'
      - 'device/dtb/**'
      - 'tools/initramfs/**'
      - 'tools/bootimg/**'
      - '.github/workflows/kernel.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build + fail-closed verify
    runs-on: ubuntu-22.04
    env:
      TC: /opt/toolchains/arm-eabi-4.8/bin/arm-eabi-

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential gcc-arm-linux-gnueabi bc cpio bzip2 curl

      - name: Toolchain (arm-eabi-4.8, AOSP 5.1 era prebuilt)
        run: |
          sudo mkdir -p /opt/toolchains
          (git clone --depth 1 --branch android-5.1.1_r38 --single-branch \
             https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8 \
             /opt/toolchains/arm-eabi-4.8) \
          || (git clone --depth 1 --branch android-5.1.1_r38 --single-branch \
             https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.8 \
             /opt/toolchains/arm-eabi-4.8)
          ls -la /opt/toolchains/arm-eabi-4.8/bin/arm-eabi-gcc
          /opt/toolchains/arm-eabi-4.8/bin/arm-eabi-gcc --version | head -1

      - name: Configure kernel (j1minilte_linux_defconfig)
        run: |
          make -C kernel ARCH=arm CROSS_COMPILE=$TC j1minilte_linux_defconfig
          make -C kernel ARCH=arm CROSS_COMPILE=$TC olddefconfig
          echo "== .config summary =="
          grep -E "CONFIG_(MACH_J1MINILTE|DEVTMPFS|VT|FRAMEBUFFER_CONSOLE)=" kernel/.config

      - name: Build zImage
        run: |
          make -C kernel ARCH=arm CROSS_COMPILE=$TC -j$(nproc) zImage
          ls -la kernel/arch/arm/boot/zImage

      - name: Diagnostic - kernel dtbs vs stock dtbs (non-gating)
        continue-on-error: true
        run: |
          mkdir -p out
          echo "== building kernel dtbs (in-tree dtc 1.2.0) =="
          if ! make -C kernel ARCH=arm CROSS_COMPILE=$TC -j$(nproc) dtbs; then
            echo "::warning::dtbs build failed - diagnostic skipped, job continues"
            exit 0
          fi
          DTBS=""
          for d in rev00 rev01 rev02 rev03 rev04; do
            f="kernel/arch/arm/boot/dts/sprd-scx35l_sharkls_j1minilte_$d.dtb"
            if [ ! -f "$f" ]; then
              echo "::warning::$f missing - diagnostic incomplete, job continues"
              exit 0
            fi
            DTBS="$DTBS $f"
          done
          echo "== comparing kernel-built dtbs vs stock (DIAGNOSTIC ONLY) =="
          python3 tools/bootimg/pack_dtimg.py --compare-dtb device/dtb/stock $DTBS --out out/dt_diag.img
          echo "diagnostic compare rc=$? (non-gating)"
          ls -la out/dt_diag.img

      - name: Build initramfs (busybox 1.36.1 static)
        run: |
          bash tools/initramfs/build_initramfs.sh
          ls -la out/ramdisk.cpio.gz

      - name: FAIL-CLOSED verify initramfs
        run: |
          set -e
          TMP=$(mktemp -d)
          gzip -t out/ramdisk.cpio.gz
          cd "$TMP"
          zcat "$GITHUB_WORKSPACE/out/ramdisk.cpio.gz" | cpio -idmu --quiet
          test -x init || { echo "FAIL: init missing or not executable"; exit 1; }
          test -x bin/busybox || { echo "FAIL: bin/busybox missing"; exit 1; }
          if readelf -l bin/busybox | grep -q INTERP; then
            echo "FAIL: busybox dynamically linked (needs static for initramfs)"; exit 1
          fi
          sh -n init || { echo "FAIL: init has a syntax error"; exit 1; }
          echo "initramfs VERIFY PASS: init (sh -n OK) + statically-linked busybox; $(du -sh "$TMP" | cut -f1) unpacked"

      - name: Pack dt.img from stock dtbs (fail-closed verify)
        run: |
          mkdir -p out
          python3 tools/bootimg/pack_dtimg.py --verify-dtb device/dtb/stock \
            device/dtb/stock/dtb_00.dtb device/dtb/stock/dtb_01.dtb \
            device/dtb/stock/dtb_02.dtb device/dtb/stock/dtb_03.dtb \
            device/dtb/stock/dtb_04.dtb --out out/dt.img
          ls -la out/dt.img

      - name: Pack boot.img (mkbootimg v0 + SEANDROIDENFORCE)
        run: |
          python3 tools/bootimg/pack_bootimg.py \
            --kernel kernel/arch/arm/boot/zImage \
            --ramdisk out/ramdisk.cpio.gz \
            --dt out/dt.img \
            --cmdline "console=ttyS1,115200n8" \
            --out out/boot.img
          ls -la out/boot.img

      - name: FAIL-CLOSED verify boot.img
        run: |
          set -e
          TMP=$(mktemp -d)
          python3 tools/bootimg/parse_bootimg.py out/boot.img "$TMP"
          echo "boot.img size: $(stat -c%s out/boot.img) bytes (limit: 16777216)"
          python3 - <<'EOF'
          import struct
          d = open("out/boot.img", "rb").read()
          assert d[0:8] == b"ANDROID!", "magic != ANDROID!"
          page = struct.unpack_from("<I", d, 36)[0]
          assert page == 2048, "page_size != 2048"
          assert struct.unpack_from("<I", d, 12)[0] == 0x00008000, "kernel_addr != 0x8000"
          assert struct.unpack_from("<I", d, 20)[0] == 0x01000000, "ramdisk_addr != 0x1000000"
          assert struct.unpack_from("<I", d, 28)[0] == 0x00F00000, "second_addr != 0xF00000"
          assert struct.unpack_from("<I", d, 32)[0] == 0x00000100, "tags_addr != 0x100"
          cmd = d[64:576].split(b"\0")[0]
          assert cmd == b"console=ttyS1,115200n8", f"cmdline {cmd!r}"
          size = len(d)
          assert size < 16777216, f"boot.img {size} B exceeds 16 MiB partition"
          k = struct.unpack_from("<I", d, 8)[0]
          r = struct.unpack_from("<I", d, 16)[0]
          dt_size = struct.unpack_from("<I", d, 40)[0]
          off = page + ((k + page - 1) // page) * page + ((r + page - 1) // page) * page
          extracted = d[off:off + dt_size]
          stock_dt = open("out/dt.img", "rb").read()
          assert extracted == stock_dt, \
              f"extracted dt.img {len(extracted)} B != packed-from-stock dt.img {len(stock_dt)} B"
          print("VERIFY PASS: header fields OK, size OK, dt.img byte-identical to packed-from-stock")
          EOF

      - name: Write SHA256SUMS + BUILD_INFO.txt
        run: |
          cp kernel/arch/arm/boot/zImage out/zImage
          cp kernel/.config out/kernel.config
          cd out
          sha256sum zImage dt.img dt_diag.img ramdisk.cpio.gz boot.img kernel.config > SHA256SUMS
          {
            echo "source_commit: $GITHUB_SHA"
            echo "defconfig: j1minilte_linux_defconfig (+ olddefconfig)"
            echo "runner: ubuntu-22.04"
            echo "toolchain: arm-eabi-4.8 @ android-5.1.1_r38 (googlesource, LineageOS mirror fallback)"
            echo "gcc_version: $(/opt/toolchains/arm-eabi-4.8/bin/arm-eabi-gcc --version | head -1)"
            echo "initramfs: H1 debug shell (linux/initramfs/init; serial ttyS1 + panel tty1, fail-closed CI verify)"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "cmdline: console=ttyS1,115200n8"
            echo "mkbootimg_params: page 2048 kernel_addr 0x00008000 ramdisk_addr 0x01000000 second_addr 0x00F00000 tags_addr 0x00000100 dt.img(SPRD,5 slots) SEANDROIDENFORCE"
          } > BUILD_INFO.txt
          cat SHA256SUMS
          echo "---"
          cat BUILD_INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-boot-j1minilte
          include-hidden-files: true
          path: |
            out/zImage
            out/dt.img
            out/dt_diag.img
            out/ramdisk.cpio.gz
            out/boot.img
            out/kernel.config
            out/SHA256SUMS
            out/BUILD_INFO.txt
          if-no-files-found: warn
